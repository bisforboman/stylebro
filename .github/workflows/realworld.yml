name: Real world

# Every StyleBro rule on public repositories at pinned commits (scripts/realworld/repos.psd1): no analyzer crashes, no
# new compile errors, no merge-conflict markers, the fixes converge, and no test that passed before fails afterwards.
# Each repo runs on the runner its `Os` in repos.psd1 names: windows-latest by default (the .NET Framework targets, and
# CRLF checkouts: git on the Windows runners converts line endings), ubuntu-latest where a Linux run gives the same
# results.
# Pull requests run it before merging; main runs it NIGHTLY instead of after every merge (a bad combination of two
# merged PRs shows up the next morning: the run fails and opens or updates the issue "Nightly real-world run failed").
on:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: realworld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # One job per repo in repos.psd1, on its runner.
      - id: matrix
        shell: pwsh
        run: |
          $repos = Import-PowerShellDataFile scripts/realworld/repos.psd1
          $include = @($repos.Keys | Sort-Object | ForEach-Object { @{ repo = $_; os = if ($repos[$_].Os) { $repos[$_].Os } else { 'windows-latest' } } })
          "matrix=$(ConvertTo-Json -Compress -Depth 5 @{ include = $include })" >> $env:GITHUB_OUTPUT

      - id: changes
        run: bash .github/changes.sh

  # A docs-only pull request (.github/changes.sh) still reports every `Real world (<repo>)` check (required by branch
  # protection; an `if:` on this matrix job would skip it without the names), on ubuntu and without doing the work.
  # `!cancelled()`: if only changes.sh fails, `relevant` is empty and everything runs.
  realworld:
    name: Real world (${{ matrix.repo }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.relevant == 'false' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Skipped (docs-only change)
        if: needs.changes.outputs.relevant == 'false'
        run: echo "Nothing that affects results changed."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant != 'false'

      - uses: actions/setup-dotnet@v6
        id: dotnet
        if: needs.changes.outputs.relevant != 'false'
        with:
          # The repositories build with older SDKs' target frameworks too.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # The pinned commit (cache keys) and the folders. The restores go to a cached NuGet folder; StyleBro's analyzers
      # never do (the hook copies them from this run's build into $WORK/stylebro-bin, outside every cached path).
      - name: Pinned commit
        id: pin
        if: needs.changes.outputs.relevant != 'false'
        shell: pwsh
        run: |
          $entry = (Import-PowerShellDataFile scripts/realworld/repos.psd1).${{ matrix.repo }}
          "commit=$($entry.Commit)" >> $env:GITHUB_OUTPUT
          $settings = [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("$($entry.Tests)|$($entry.TestFilter)"))
          "testsettings=$([Convert]::ToHexString($settings).Substring(0, 16))" >> $env:GITHUB_OUTPUT
          "WORK=${{ runner.temp }}/realworld" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=${{ runner.temp }}/realworld-nuget" >> $env:GITHUB_ENV

      # The clone's .git (the pinned commit: no fetch on a hit) and the NuGet packages its restore downloads. Restored on
      # every run, saved only outside pull requests: caches saved on main (the nightly run) reach every PR, a PR's own
      # would only reach that PR and push main's out of the 10 GB limit. A changed pin or SDK starts a new cache.
      - name: Restore the clone
        id: clone
        if: needs.changes.outputs.relevant != 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.WORK }}/${{ matrix.repo }}/.git
          key: realworld-clone-${{ matrix.repo }}-${{ steps.pin.outputs.commit }}

      - name: Restore the NuGet packages
        id: nuget
        if: needs.changes.outputs.relevant != 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: realworld-nuget-${{ runner.os }}-${{ matrix.repo }}-${{ steps.pin.outputs.commit }}-sdk${{ steps.dotnet.outputs.dotnet-version }}
          restore-keys: realworld-nuget-${{ runner.os }}-${{ matrix.repo }}-

      # The tests that fail on the untouched code. They depend on the pinned commit, the SDK, the OS and the test logic
      # (FailedTests.ps1, the repo's Tests and TestFilter), not on StyleBro, so a hit skips that Release build and test
      # run. Saved like the caches above, and only after a successful run (a broken baseline would otherwise be kept).
      - name: Restore the untouched code's test results
        id: tests
        if: needs.changes.outputs.relevant != 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/realworld-tests.json
          key: realworld-tests-${{ runner.os }}-${{ matrix.repo }}-${{ steps.pin.outputs.commit }}-sdk${{ steps.dotnet.outputs.dotnet-version }}-${{ steps.pin.outputs.testsettings }}-${{ hashFiles('scripts/realworld/FailedTests.ps1') }}

      - name: Run StyleBro on ${{ matrix.repo }}
        id: run
        if: needs.changes.outputs.relevant != 'false'
        shell: pwsh
        run: ./scripts/realworld/Invoke-RealWorld.ps1 -Repo ${{ matrix.repo }} -Tests -Work $env:WORK -TestCache '${{ runner.temp }}/realworld-tests.json'

      # Saved even when the run found problems: the clone and the packages don't depend on the result.
      - name: Save the clone
        if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.outputs.relevant != 'false' && steps.clone.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.WORK }}/${{ matrix.repo }}/.git
          key: ${{ steps.clone.outputs.cache-primary-key }}

      - name: Save the NuGet packages
        if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.outputs.relevant != 'false' && steps.nuget.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ steps.nuget.outputs.cache-primary-key }}

      - name: Save the untouched code's test results
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.run.outcome == 'success' && steps.tests.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/realworld-tests.json
          key: ${{ steps.tests.outputs.cache-primary-key }}

  # A failed nightly run opens the issue "Nightly real-world run failed", or comments on it while it is open.
  nightly-issue:
    needs: realworld
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - run: bash .github/nightly-issue.sh "Nightly real-world run failed"
        env:
          GH_TOKEN: ${{ github.token }}
