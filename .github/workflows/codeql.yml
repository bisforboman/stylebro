name: CodeQL

# GitHub's code scanning for StyleBro's C# (build-free mode: no compile needed): pull requests to main, every push to
# main, and weekly, so new queries look at old code too. A pull request that changes only Markdown or docs/ skips it
# (nothing CodeQL reads). Findings are under Security > Code scanning; not a required check. This is an advanced setup:
# Settings > Code security > Code scanning's default setup must be off, or the upload fails.
# docs/decisions/2026-11-06-security-analyzers-and-codeql.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:csharp
