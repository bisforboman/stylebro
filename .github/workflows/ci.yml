name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # What the pull request changes (.github/changes.sh). A docs-only change skips the work of parity, performance (also
  # skipped unless analyzer code changed), the real-world and the mutation jobs; they still report their checks.
  # `!cancelled()` on the jobs below: if this job fails, its outputs are empty and everything runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      perf: ${{ steps.changes.outputs.perf }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changes
        run: bash .github/changes.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test StyleBro.slnx

      - name: Verify dotnet format integration
        shell: pwsh
        run: ./scripts/verify-format.ps1

      # StyleBro's own code follows its rules (the latest published release, see Directory.Build.props).
      - name: Check StyleBro's own code style
        run: dotnet format StyleBro.slnx --verify-no-changes --severity warn --exclude samples

      - name: Verify the package as a consumer uses it
        shell: pwsh
        run: ./scripts/verify-package.ps1

      - name: Pack
        run: |
          dotnet pack src/StyleBro.Package --output artifacts
          dotnet pack src/StyleBro.Migrate --output artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # StyleBro and StyleCop 1.2 run on the same edge-case files (scripts/stylecop-survey/parity); every difference in
  # positions or fixed output must be listed as a documented deviation in parity.psd1.
  parity:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skipped (docs-only change)
        if: needs.changes.outputs.relevant == 'false'
        run: echo "Nothing that affects results changed."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant != 'false'

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.relevant != 'false'
        with:
          dotnet-version: 10.0.x

      - name: Compare with StyleCop
        if: needs.changes.outputs.relevant != 'false'
        shell: pwsh
        run: |
          $env:StyleBroSelf = 'none'
          dotnet build src/StyleBro.CodeFixes -nologo -v q
          ./scripts/stylecop-survey/Compare-WithStyleCop.ps1

  # The PR's analyzers against the base branch's, alternated in one process on Newtonsoft.Json's main project
  # (scripts/benchmark, compare mode): fails when an analyzer or the total is clearly slower. Results in the job summary.
  performance:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skipped (analyzer code unchanged)
        if: needs.changes.outputs.perf == 'false'
        run: echo "Nothing that affects analyzer speed changed."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.perf != 'false'
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.perf != 'false'
        with:
          dotnet-version: 10.0.x

      - name: Compare analyzer speed with the base branch
        if: needs.changes.outputs.perf != 'false'
        shell: pwsh
        run: |
          $env:StyleBroSelf = 'none'
          $work = '${{ runner.temp }}'
          dotnet build src/StyleBro.Analyzers -c Release -nologo -v q -o "$work/head"
          git worktree add "$work/base-src" "origin/${{ github.base_ref }}"
          dotnet build "$work/base-src/src/StyleBro.Analyzers" -c Release -nologo -v q -o "$work/base"

          # The same pinned commit as the real-world check.
          $nj = (Import-PowerShellDataFile scripts/realworld/repos.psd1).Newtonsoft
          git init -q "$work/nj"
          git -C "$work/nj" fetch -q --depth 1 $nj.Url $nj.Commit
          git -C "$work/nj" checkout -q FETCH_HEAD

          dotnet run -c Release --project scripts/benchmark -- compare "$work/base/StyleBro.Analyzers.dll" "$work/head/StyleBro.Analyzers.dll" "$work/nj/Src/Newtonsoft.Json" 10
          exit $LASTEXITCODE
