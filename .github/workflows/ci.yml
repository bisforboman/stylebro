name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test StyleBro.slnx

      - name: Verify dotnet format integration
        shell: pwsh
        run: ./scripts/verify-format.ps1

      - name: Pack
        run: dotnet pack src/StyleBro.Package --output artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
