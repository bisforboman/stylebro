name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test StyleBro.slnx

      - name: Verify dotnet format integration
        shell: pwsh
        run: ./scripts/verify-format.ps1

      # StyleBro's own code follows its rules (the latest published release, see Directory.Build.props).
      - name: Check StyleBro's own code style
        run: dotnet format StyleBro.slnx --verify-no-changes --severity warn --exclude samples

      - name: Verify the package as a consumer uses it
        shell: pwsh
        run: ./scripts/verify-package.ps1

      - name: Pack
        run: |
          dotnet pack src/StyleBro.Package --output artifacts
          dotnet pack src/StyleBro.Migrate --output artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # StyleBro and StyleCop 1.2 run on the same edge-case files (scripts/stylecop-survey/parity); every difference in
  # positions or fixed output must be listed as a documented deviation in parity.psd1.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compare with StyleCop
        shell: pwsh
        run: |
          $env:StyleBroSelf = 'none'
          dotnet build src/StyleBro.CodeFixes -nologo -v q
          ./scripts/stylecop-survey/Compare-WithStyleCop.ps1
