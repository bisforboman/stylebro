name: Docs

# The documentation site (mkdocs.yml, docs/): built with --strict on every pull request (a broken link, anchor or a
# page missing from the nav fails it), deployed to GitHub Pages from main. Deploying needs Pages turned on once in the
# repository settings (Settings > Pages > Source: GitHub Actions); until then the deploy job fails, the build doesn't.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - run: pip install -r .github/docs-requirements.txt

      # docs/backlog.md isn't committed (parallel pull requests would conflict on it); this checks that it generates.
      - run: python scripts/New-Backlog.py

      # MkDocs only logs links to excluded internal pages (decisions, backlog.md, ...) as INFO; fail on them too:
      # they must be absolute GitHub links.
      - name: Build
        run: |
          set -o pipefail
          mkdocs build --strict 2>&1 | tee build.log
          if grep -q 'excluded from the built site' build.log; then
            echo '::error::A page links to an excluded internal page; use an absolute GitHub link.'
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: site
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The generated internal pages that would conflict between parallel pull requests if committed (docs/backlog.md), on
  # the 'generated' branch: main's tree plus those files, so their relative links work on GitHub.
  generated:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish to the generated branch
        run: |
          python3 scripts/New-Backlog.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/backlog.md
          git commit -qm "Generated pages for ${GITHUB_SHA::7}"
          git push -f origin HEAD:refs/heads/generated
