name: Mutation testing

# Breaks each guard listed in scripts/mutation/mutations/*.psd1 and checks that a test fails. The entries are split over
# parallel shards (index modulo the shard count); the job named `mutation` (the required check) passes only when every
# shard passed. On a pull request only the entries for the files it changes run (.github/changes.sh, -OnlyFiles; the
# stale check still covers every entry); the nightly run on main runs them all (instead of a run after every merge; a
# failure opens or updates the issue "Nightly mutation run failed").
on:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      files: ${{ steps.changes.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changes
        run: bash .github/changes.sh

  shard:
    name: mutation shard ${{ matrix.shard }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.relevant != 'false'
        with:
          dotnet-version: 10.0.x

      - name: Mutate the guards
        shell: pwsh
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
        run: |
          $only = @{}
          if ('${{ github.event_name }}' -eq 'pull_request') { $only.OnlyFiles = @($env:CHANGED_FILES -split "`n" | Where-Object { $_ }) }
          ./scripts/mutation/Invoke-Mutations.ps1 -Shard ${{ matrix.shard }} -Shards 4 @only

  # The required check. `always()` so a failed or cancelled shard fails it instead of skipping it.
  mutation:
    needs: [changes, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the shards
        run: |
          echo "Changes: ${{ needs.changes.result }}, shards: ${{ needs.shard.result }}"
          test "${{ needs.changes.result }}" = success
          test "${{ needs.shard.result }}" = success

  # A failed nightly run opens the issue "Nightly mutation run failed", or comments on it while it is open.
  nightly-issue:
    needs: mutation
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - run: bash .github/nightly-issue.sh "Nightly mutation run failed"
        env:
          GH_TOKEN: ${{ github.token }}
