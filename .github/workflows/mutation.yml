name: Mutation testing

# Breaks each guard listed in scripts/mutation/mutations.psd1 and checks that a test fails.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Mutate the guards
        shell: pwsh
        run: ./scripts/mutation/Invoke-Mutations.ps1
