site_name: StyleBro
site_description: Roslyn analyzers and code fixes for C#, a modern StyleCop replacement that dotnet format fixes.
site_url: https://bisforboman.github.io/stylebro/
repo_url: https://github.com/bisforboman/stylebro
repo_name: bisforboman/stylebro
edit_uri: edit/main/docs/
docs_dir: docs

# Internal pages (plans, decisions, proposals) stay on GitHub only.
exclude_docs: |
  backlog.md
  beyond-stylecop.md
  decisions.md
  proposals/

# With --strict these fail the build: a broken link or anchor, or a page missing from the nav.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# Rule pages: grouped like docs/rules/README.md (DocExamplesTests checks that they match).
